name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e . pytest ruff mypy
      - name: Run tests
        run: python -m pytest -q
      - name: Ruff check
        run: python -m ruff check src tests
      - name: Mypy check
        run: python -m mypy src/codex_proxy
